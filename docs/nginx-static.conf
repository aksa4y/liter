# Replace the domain and root with your real values.
# HTTPS configuration is managed separately by your hosting/certificate tool.
server {
    listen 80;
    server_name pixelhav.ru www.pixelhav.ru;
    root /var/www/pixelhav;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /fonts/ {
        try_files $uri $uri/ =404;
    }
}
