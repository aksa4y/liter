# Static Nginx example for Pixelhav.
# Point both pixelhav.ru and www.pixelhav.ru to this host.
# The TLS certificate must cover BOTH names. These paths assume Certbot issued
# a certificate named pixelhav.ru; adjust them if your hosting uses other paths.
server {
    listen 80;
    server_name pixelhav.ru www.pixelhav.ru;
    return 301 https://pixelhav.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.pixelhav.ru;

    ssl_certificate /etc/letsencrypt/live/pixelhav.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixelhav.ru/privkey.pem;

    return 301 https://pixelhav.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pixelhav.ru;

    ssl_certificate /etc/letsencrypt/live/pixelhav.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixelhav.ru/privkey.pem;

    root /var/www/pixelhav;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /fonts/ {
        try_files $uri $uri/ =404;
    }
}
